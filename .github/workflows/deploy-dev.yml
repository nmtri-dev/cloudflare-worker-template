name: '[DEV] Deploy Worker'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast unit + integration gate before any infra change.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test # fast unit gate before deploy
      - run: npm run test:integration # integration (workers pool)

  # 1) Plan + apply infra (Worker script + bindings) via the shared reusable
  #    workflow (terraform.yml). The apply job is gated by required reviewers
  #    configured on the DEV environment.
  #
  # NOTE: this service's empty state (cloudflare-worker-template/dev) must be
  # seeded ONCE before the first deploy — run the manual "[DEV] Terraform Init
  # State" action. The seed makes the bootstrap ordering symmetric: sibling
  # services read this state via terraform_remote_state to auto-discover the
  # worker name + entrypoint for their bindings; empty files resolve to null
  # until this service actually deploys, after which its real state replaces
  # the seed permanently.
  terraform:
    needs: test
    uses: ./.github/workflows/terraform.yml
    with:
      environment: DEV
    secrets: inherit

  # 2) D1 migrations — runs only after the terraform apply job has completed
  #    (needs: terraform). The database name comes from the reusable workflow's
  #    output, which is computed after apply. Also binds DEV so required
  #    reviewers gate it too.
  migrate:
    runs-on: ubuntu-latest
    needs: terraform
    environment: DEV
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler d1 migrations apply <name> --env dev resolves <name> against
      # the dev env block in wrangler.jsonc and uses its `database_id` for the
      # API call (it does NOT look the name up at runtime). Terraform creates
      # the DB, so the real ID only exists in its state — inject it here so
      # migrations run against the actual database (self-healing per deploy).
      - name: Patch wrangler.jsonc with real D1 database ID
        env:
          DB_ID: ${{ needs.terraform.outputs.d1_database_id }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "wrangler.jsonc";
            let src = fs.readFileSync(p, "utf8");
            const before = src;
            src = src.replace(
              /("database_name"\s*:\s*"cloudflare-worker-template-dev-db"[\s\S]*?"database_id"\s*:\s*)"[^"]*"/,
              (m, pre) => pre + JSON.stringify(process.env.DB_ID)
            );
            if (src === before) {
              console.error("Could not find dev database_id to patch");
              process.exit(1);
            }
            fs.writeFileSync(p, src);
            console.log("Patched dev database_id ->", process.env.DB_ID);
          '

      - name: Run D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          DB_NAME: ${{ needs.terraform.outputs.d1_database_name }}
        run: |
          npx wrangler d1 migrations apply "$DB_NAME" --remote --env dev
